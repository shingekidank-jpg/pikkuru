<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ピックルボール スコアボード</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* タッチ時の選択・ダブルタップズーム防止 */
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    /* スコア数字：clamp()でモバイル画面に合わせて限界まで自動拡大 */
    .score-font {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: clamp(5rem, 22vw, 16rem);
      line-height: 1;
    }

    /* アニメーション */
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.98); }
    }
    .serving-active {
      animation: pulse-subtle 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between overflow-hidden text-slate-100 select-none">

  <!-- ================= HEADER / CONTROL BAR ================= -->
  <header class="bg-slate-900 border-b border-slate-800 px-3 py-2 flex justify-between items-center z-20 shrink-0">
    <div class="flex items-center space-x-2">
      <!-- 審判 ↔ 表示 モード切替ボタン -->
      <button id="toggle-mode-btn" onclick="toggleDisplayMode()" class="px-3 py-1.5 rounded-lg font-bold text-xs sm:text-sm bg-emerald-500 hover:bg-emerald-600 text-slate-950 flex items-center shadow-lg transition-all">
        <i class="fa-solid fa-expand mr-1.5 text-base" id="mode-icon"></i>
        <span id="mode-text">表示モードへ</span>
      </button>

      <!-- 設定・操作ボタン（審判モード時のみ有効） -->
      <div id="referee-controls-left" class="flex items-center space-x-1">
        <button onclick="undoLastAction()" id="undo-btn" class="px-2.5 py-1.5 rounded-lg text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 disabled:opacity-40 disabled:cursor-not-allowed border border-slate-700 flex items-center" title="1手戻す">
          <i class="fa-solid fa-rotate-left mr-1"></i> 戻す
        </button>
        <button onclick="openSettingsModal()" class="px-2.5 py-1.5 rounded-lg text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center">
          <i class="fa-solid fa-gear mr-1"></i> 設定
        </button>
      </div>
    </div>

    <!-- リセット -->
    <div id="referee-controls-right" class="flex items-center space-x-2">
      <button onclick="resetGameWithConfirm()" class="px-2 py-1.5 rounded-lg text-xs bg-rose-950 hover:bg-rose-900 text-rose-300 border border-rose-800/60 flex items-center">
        <i class="fa-solid fa-arrow-rotate-right mr-1"></i> リセット
      </button>
    </div>
  </header>

  <!-- ================= MAIN SCOREBOARD CONTENT ================= -->
  <main id="main-container" class="relative flex-1 flex flex-col landscape:flex-row p-2 gap-2 h-full overflow-hidden transition-all duration-300">
    
    <!-- タップ無効化用オーバーレイ（表示モード用） -->
    <div id="lock-overlay" class="hidden absolute inset-0 z-10 bg-transparent"></div>

    <!-- チーム A (水色 / Cyan 固定) -->
    <section id="team-a-card" class="flex-1 rounded-2xl bg-gradient-to-br from-slate-900 to-slate-900/80 border-2 border-cyan-500/50 flex flex-col justify-between p-3 relative overflow-hidden transition-all">
      <!-- チーム名 & タイムアウト -->
      <div class="flex justify-between items-center border-b border-slate-800/80 pb-2 z-0">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-cyan-400 shrink-0"></span>
          <input type="text" id="team-a-name" value="チーム A" onchange="updateTeamNames()" class="bg-transparent font-bold text-base sm:text-lg text-cyan-400 focus:outline-none border-b border-transparent focus:border-cyan-400 px-1 w-24 sm:w-36">
        </div>
        <button id="timeout-a-btn" onclick="triggerTimeout('A')" class="referee-only px-2 py-1 rounded bg-slate-800 text-slate-300 text-xs border border-slate-700 flex items-center gap-1 hover:bg-slate-700">
          <i class="fa-solid fa-stopwatch"></i> TO (<span id="timeout-a-count">2</span>)
        </button>
      </div>

      <!-- プレイヤー一覧 (ダブルス用) -->
      <div id="team-a-players-container" class="mt-2 flex gap-2">
        <div id="player-a1-box" class="flex-1 p-1.5 rounded-lg border border-slate-800 bg-slate-950/50 flex items-center justify-between transition-all">
          <input type="text" id="player-a1-name" value="選手 1" class="bg-transparent text-xs font-semibold text-cyan-300 focus:outline-none w-full">
          <span id="player-a1-badge" class="hidden text-[10px] px-1.5 py-0.5 rounded bg-cyan-400 text-slate-950 font-bold shrink-0 ml-1">サーブ</span>
        </div>
        <div id="player-a2-box" class="flex-1 p-1.5 rounded-lg border border-slate-800 bg-slate-950/50 flex items-center justify-between transition-all">
          <input type="text" id="player-a2-name" value="選手 2" class="bg-transparent text-xs font-semibold text-cyan-300 focus:outline-none w-full">
          <span id="player-a2-badge" class="hidden text-[10px] px-1.5 py-0.5 rounded bg-cyan-400 text-slate-950 font-bold shrink-0 ml-1">サーブ</span>
        </div>
      </div>

      <!-- スコア表示部 -->
      <div class="flex-1 flex flex-col justify-center items-center my-1">
        <div id="team-a-score" class="score-font text-cyan-400 drop-shadow-[0_0_15px_rgba(34,211,238,0.2)]">
          0
        </div>
        <!-- サーバーバッジ -->
        <div id="team-a-server-badge" class="mt-2 px-3 py-1 rounded-full text-xs font-bold bg-cyan-950 text-cyan-300 border border-cyan-500/40 flex items-center gap-1.5">
          <i class="fa-solid fa-table-tennis-paddle-ball text-cyan-400"></i>
          <span id="team-a-server-text">待機中</span>
        </div>
      </div>

      <!-- 操作ボタン (審判モードのみ) -->
      <div class="referee-only grid grid-cols-2 gap-2 mt-1 z-0">
        <button onclick="addPoint('A')" class="py-2.5 sm:py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 active:bg-cyan-700 text-slate-950 font-black text-base shadow-lg flex flex-col items-center justify-center">
          <span>+1 ポイント</span>
        </button>
        <button onclick="handleFault('A')" class="py-2.5 sm:py-3 rounded-xl bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-rose-400 font-bold text-xs border border-slate-700 flex flex-col items-center justify-center">
          <span>ミス / エラー</span>
        </button>
      </div>
    </section>

    <!-- センター情報 & コート表示 -->
    <section id="center-info-panel" class="shrink-0 flex landscape:flex-col justify-between items-center bg-slate-900/90 rounded-xl p-2 border border-slate-800 gap-2 min-w-[140px]">
      <!-- サービス状態メッセージ -->
      <div class="text-center flex-1 landscape:flex-none">
        <div class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">コール</div>
        <div id="call-display" class="text-base sm:text-xl font-black tracking-wider my-0.5 transition-colors text-cyan-400">
          0 - 0 - 2
        </div>
        <div id="serving-team-label" class="text-[11px] font-semibold transition-colors text-cyan-400">
          チーム A サーブ
        </div>
      </div>

      <!-- コート表示 -->
      <div id="court-diagram" class="w-28 h-16 sm:w-36 sm:h-20 landscape:w-36 landscape:h-20 bg-slate-950 border border-slate-700 rounded relative flex flex-col landscape:flex-row shrink-0 overflow-hidden my-auto">
        <div class="absolute inset-x-0 top-1/2 h-0.5 bg-slate-400 z-10 -translate-y-1/2 landscape:hidden"></div>
        <div class="hidden landscape:block absolute inset-y-0 left-1/2 w-0.5 bg-slate-400 z-10 -translate-x-1/2"></div>
        <div class="absolute inset-x-0 top-[35%] bottom-[35%] bg-amber-500/10 border-y border-amber-500/30 landscape:hidden"></div>
        <div class="hidden landscape:block absolute inset-y-0 left-[35%] right-[35%] bg-amber-500/10 border-x border-amber-500/30"></div>
        
        <!-- 上 / 左コート (チーム A - 水色) -->
        <div id="court-a-section" class="flex-1 grid grid-cols-2 landscape:grid-cols-1 landscape:grid-rows-2 border-b landscape:border-b-0 landscape:border-r border-slate-800">
          <div id="court-a-left" class="border-r landscape:border-r-0 landscape:border-b border-slate-800/50 flex items-center justify-center text-[9px] text-cyan-500/60 font-bold">L</div>
          <div id="court-a-right" class="flex items-center justify-center text-[9px] text-cyan-500/60 font-bold">R</div>
        </div>
        <!-- 下 / 右コート (チーム B - オレンジ) -->
        <div id="court-b-section" class="flex-1 grid grid-cols-2 landscape:grid-cols-1 landscape:grid-rows-2">
          <div id="court-b-left" class="border-r landscape:border-r-0 landscape:border-b border-slate-800/50 flex items-center justify-center text-[9px] text-amber-500/60 font-bold">L</div>
          <div id="court-b-right" class="flex items-center justify-center text-[9px] text-amber-500/60 font-bold">R</div>
        </div>
      </div>

      <!-- 手動切替ボタン -->
      <div class="referee-only flex landscape:flex-col gap-1">
        <button onclick="switchServerManual()" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] border border-slate-700" title="1st/2nd手動切替">
          <i class="fa-solid fa-arrows-rotate mr-1"></i> 1st/2nd
        </button>
        <button onclick="swapSides()" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] border border-slate-700" title="コート交代">
          <i class="fa-solid fa-right-left mr-1"></i> コート交代
        </button>
      </div>
    </section>

    <!-- チーム B (オレンジ / Amber 固定) -->
    <section id="team-b-card" class="flex-1 rounded-2xl bg-gradient-to-br from-slate-900 to-slate-900/80 border-2 border-amber-500/50 flex flex-col justify-between p-3 relative overflow-hidden transition-all">
      <!-- チーム名 & タイムアウト -->
      <div class="flex justify-between items-center border-b border-slate-800/80 pb-2 z-0">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-amber-400 shrink-0"></span>
          <input type="text" id="team-b-name" value="チーム B" onchange="updateTeamNames()" class="bg-transparent font-bold text-base sm:text-lg text-amber-400 focus:outline-none border-b border-transparent focus:border-amber-400 px-1 w-24 sm:w-36">
        </div>
        <button id="timeout-b-btn" onclick="triggerTimeout('B')" class="referee-only px-2 py-1 rounded bg-slate-800 text-slate-300 text-xs border border-slate-700 flex items-center gap-1 hover:bg-slate-700">
          <i class="fa-solid fa-stopwatch"></i> TO (<span id="timeout-b-count">2</span>)
        </button>
      </div>

      <!-- プレイヤー一覧 (ダブルス用) -->
      <div id="team-b-players-container" class="mt-2 flex gap-2">
        <div id="player-b1-box" class="flex-1 p-1.5 rounded-lg border border-slate-800 bg-slate-950/50 flex items-center justify-between transition-all">
          <input type="text" id="player-b1-name" value="選手 1" class="bg-transparent text-xs font-semibold text-amber-300 focus:outline-none w-full">
          <span id="player-b1-badge" class="hidden text-[10px] px-1.5 py-0.5 rounded bg-amber-400 text-slate-950 font-bold shrink-0 ml-1">サーブ</span>
        </div>
        <div id="player-b2-box" class="flex-1 p-1.5 rounded-lg border border-slate-800 bg-slate-950/50 flex items-center justify-between transition-all">
          <input type="text" id="player-b2-name" value="選手 2" class="bg-transparent text-xs font-semibold text-amber-300 focus:outline-none w-full">
          <span id="player-b2-badge" class="hidden text-[10px] px-1.5 py-0.5 rounded bg-amber-400 text-slate-950 font-bold shrink-0 ml-1">サーブ</span>
        </div>
      </div>

      <!-- スコア表示部 -->
      <div class="flex-1 flex flex-col justify-center items-center my-1">
        <div id="team-b-score" class="score-font text-amber-400 drop-shadow-[0_0_15px_rgba(251,191,36,0.2)]">
          0
        </div>
        <!-- サーバーバッジ -->
        <div id="team-b-server-badge" class="mt-2 px-3 py-1 rounded-full text-xs font-bold bg-amber-950 text-amber-300 border border-amber-500/40 flex items-center gap-1.5">
          <i class="fa-solid fa-table-tennis-paddle-ball text-amber-400"></i>
          <span id="team-b-server-text">待機中</span>
        </div>
      </div>

      <!-- 操作ボタン (審判モードのみ) -->
      <div class="referee-only grid grid-cols-2 gap-2 mt-1 z-0">
        <button onclick="addPoint('B')" class="py-2.5 sm:py-3 rounded-xl bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-black text-base shadow-lg flex flex-col items-center justify-center">
          <span>+1 ポイント</span>
        </button>
        <button onclick="handleFault('B')" class="py-2.5 sm:py-3 rounded-xl bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-rose-400 font-bold text-xs border border-slate-700 flex flex-col items-center justify-center">
          <span>ミス / エラー</span>
        </button>
      </div>
    </section>

  </main>

  <!-- ================= MODALS & OVERLAYS ================= -->

  <!-- 1. 最初のサーバー選択 Modal -->
  <div id="start-server-modal" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-emerald-500 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
      <div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
        <i class="fa-solid fa-coins"></i>
      </div>
      <h3 class="text-xl font-black text-slate-100 mb-1">ファーストサーバー選択</h3>
      <p class="text-xs text-slate-400 mb-5">トスで決定した「最初にサーブを打つチーム」を選択してください</p>
      
      <div class="grid grid-cols-2 gap-3 mb-4">
        <button onclick="selectFirstServer('A')" class="p-4 rounded-xl bg-cyan-950/80 hover:bg-cyan-900 border-2 border-cyan-500/60 text-cyan-300 font-bold flex flex-col items-center justify-center transition-all">
          <span class="text-xs text-cyan-400">チーム A (水色)</span>
          <span id="modal-team-a-label" class="text-base font-black">チーム A</span>
        </button>
        <button onclick="selectFirstServer('B')" class="p-4 rounded-xl bg-amber-950/80 hover:bg-amber-900 border-2 border-amber-500/60 text-amber-300 font-bold flex flex-col items-center justify-center transition-all">
          <span class="text-xs text-amber-400">チーム B (オレンジ)</span>
          <span id="modal-team-b-label" class="text-base font-black">チーム B</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 2. 試合勝利 Modal -->
  <div id="winner-modal" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-emerald-500 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
      <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <h2 id="winner-title" class="text-2xl font-black text-slate-100 mb-1">GAME SET!</h2>
      <p id="winner-text" class="text-emerald-400 font-bold text-lg mb-4">チーム A の勝利！</p>
      <div id="winner-score-summary" class="text-3xl font-extrabold text-slate-300 mb-6 score-font">
        11 - 9
      </div>
      <div class="flex gap-2">
        <button onclick="undoLastAction(); closeModal('winner-modal');" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold text-xs sm:text-sm">
          1手戻す
        </button>
        <button onclick="resetGame(); closeModal('winner-modal');" class="flex-1 py-2.5 rounded-xl bg-emerald-500 text-slate-950 hover:bg-emerald-400 font-bold text-xs sm:text-sm">
          次のゲームへ
        </button>
      </div>
    </div>
  </div>

  <!-- 3. タイムアウトタイマー Modal -->
  <div id="timeout-modal" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl">
      <h3 class="text-lg font-bold text-slate-300 mb-1">タイムアウト中</h3>
      <p id="timeout-team-name" class="text-amber-400 font-bold text-sm mb-4">チーム A</p>
      <div id="timeout-timer" class="text-6xl font-black text-slate-100 score-font my-4">60</div>
      <button onclick="closeTimeoutModal()" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm">
        タイマーを終了
      </button>
    </div>
  </div>

  <!-- 4. 設定 Modal -->
  <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-sm w-full shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
        <h3 class="font-bold text-lg text-slate-100"><i class="fa-solid fa-sliders mr-2"></i>ゲーム設定</h3>
        <button onclick="closeModal('settings-modal')" class="text-slate-400 hover:text-slate-100 p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <div class="space-y-4 text-sm">
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1.5">種目</label>
          <div class="grid grid-cols-2 gap-2">
            <button id="opt-doubles" onclick="setGameType('doubles')" class="py-2 rounded-lg font-bold border text-center transition-all">ダブルス</button>
            <button id="opt-singles" onclick="setGameType('singles')" class="py-2 rounded-lg font-bold border text-center transition-all">シングルス</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1.5">目標ポイント (マッチポイント)</label>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="setTargetScore(11)" id="target-11" class="target-score-btn py-1.5 rounded-lg border font-bold">11点</button>
            <button onclick="setTargetScore(15)" id="target-15" class="target-score-btn py-1.5 rounded-lg border font-bold">15点</button>
            <button onclick="setTargetScore(21)" id="target-21" class="target-score-btn py-1.5 rounded-lg border font-bold">21点</button>
          </div>
        </div>

        <div class="flex justify-between items-center py-1">
          <span class="font-medium text-slate-300">デュース (2点差で勝利)</span>
          <input type="checkbox" id="win-by-two" checked onchange="toggleWinByTwo()" class="w-5 h-5 accent-emerald-500 rounded cursor-pointer">
        </div>
      </div>

      <div class="mt-6">
        <button onclick="closeModal('settings-modal')" class="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold">
          完了
        </button>
      </div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    /* ================= APP STATE ================= */
    let state = {
      isDoubles: true,
      targetScore: 11,
      winByTwo: true,
      
      scoreA: 0,
      scoreB: 0,
      
      servingTeam: 'A',         // 'A' または 'B'
      serverNumber: 2,          // 試合開始最初の1点目のみ例外的に "2"
      isInitialFirstServer: true, // 最初のファーストサーバーフラグ
      
      activeServerA: 1,
      activeServerB: 1,

      isSwapped: false,          // コートチェンジ状態フラグ

      timeoutsA: 2,
      timeoutsB: 2,
      
      isDisplayMode: false,
      gameEnded: false
    };

    let historyStack = [];
    let timeoutTimerInterval = null;

    /* ================= INITIALIZATION ================= */
    window.onload = () => {
      saveStateToHistory();
      updateUI();
      openStartServerModal();
      requestWakeLock();
    };

    function openStartServerModal() {
      const nameA = document.getElementById('team-a-name').value || 'チーム A';
      const nameB = document.getElementById('team-b-name').value || 'チーム B';
      document.getElementById('modal-team-a-label').innerText = nameA;
      document.getElementById('modal-team-b-label').innerText = nameB;
      showModal('start-server-modal');
    }

    function selectFirstServer(team) {
      saveStateToHistory();
      state.servingTeam = team;
      state.serverNumber = state.isDoubles ? 2 : 1; 
      state.isInitialFirstServer = true;
      state.activeServerA = 1;
      state.activeServerB = 1;
      closeModal('start-server-modal');
      updateUI();
    }

    /* ================= CORE PICKLEBALL LOGIC ================= */

    function addPoint(team) {
      if (state.gameEnded) return;
      saveStateToHistory();
      vibrate();

      if (state.isDoubles) {
        if (state.servingTeam === team) {
          // 1. サーブ側のチームがポイントを獲得した場合：得点が加算され、サーバー番号が更新される
          if (team === 'A') {
            state.scoreA++;
          } else {
            state.scoreB++;
          }

          if (state.isInitialFirstServer) {
            state.serverNumber = 2;
          } else {
            if (state.serverNumber === 1) {
              state.serverNumber = 2;
            }
          }
          checkWinner();
        } else {
          // 2. レシーブ側（サーブ権がないチーム）のボタンが押された場合：
          // ピックルボールのルール上、レシーブ側が得点することはできないため、スコアは増やさず「サイドアウト（サーブ権移動）」にする
          state.isInitialFirstServer = false;
          state.servingTeam = team;
          state.serverNumber = 1;
        }
      } else {
        // シングルス
        if (state.servingTeam === team) {
          if (team === 'A') state.scoreA++;
          else state.scoreB++;
          checkWinner();
        } else {
          state.servingTeam = team;
        }
      }

      updateUI();
    }

    function handleFault(faultingTeam) {
      if (state.gameEnded) return;
      saveStateToHistory();
      vibrate([50, 50]);

      if (state.servingTeam === faultingTeam) {
        handleFaultInternal(faultingTeam);
      }
      updateUI();
    }

    function handleFaultInternal(faultingTeam) {
      if (state.isDoubles) {
        if (state.isInitialFirstServer) {
          // 最初のファーストサーバー（0-0-2）ミス -> 即サイドアウト（相手の「1」へ）
          state.isInitialFirstServer = false;
          state.servingTeam = faultingTeam === 'A' ? 'B' : 'A';
          state.serverNumber = 1;
        } else if (state.serverNumber === 1) {
          // 1stサーバー失敗 -> 同じチームの2ndサーバーへ交代 (選手もパートナーに切替)
          state.serverNumber = 2;
          if (faultingTeam === 'A') {
            state.activeServerA = state.activeServerA === 1 ? 2 : 1;
          } else {
            state.activeServerB = state.activeServerB === 1 ? 2 : 1;
          }
        } else {
          // 2ndサーバー失敗 -> サイドアウト（相手チームの1stサーバーへ交代）
          state.servingTeam = faultingTeam === 'A' ? 'B' : 'A';
          state.serverNumber = 1;
        }
      } else {
        // シングルス: 即サイドアウト
        state.servingTeam = faultingTeam === 'A' ? 'B' : 'A';
      }
    }

    function checkWinner() {
      const { scoreA, scoreB, targetScore, winByTwo } = state;
      let winner = null;

      if (scoreA >= targetScore) {
        if (!winByTwo || (scoreA - scoreB >= 2)) {
          winner = document.getElementById('team-a-name').value || 'チーム A';
        }
      } else if (scoreB >= targetScore) {
        if (!winByTwo || (scoreB - scoreA >= 2)) {
          winner = document.getElementById('team-b-name').value || 'チーム B';
        }
      }

      if (winner) {
        state.gameEnded = true;
        document.getElementById('winner-title').innerText = "GAME SET!";
        document.getElementById('winner-text').innerText = `${winner} の勝利！`;
        document.getElementById('winner-score-summary').innerText = `${scoreA} - ${scoreB}`;
        showModal('winner-modal');
      }
    }

    /* ================= HISTORY & UNDO ================= */

    function saveStateToHistory() {
      if (historyStack.length >= 20) historyStack.shift();
      historyStack.push(JSON.stringify(state));
      document.getElementById('undo-btn').disabled = false;
    }

    function undoLastAction() {
      if (historyStack.length === 0) return;
      vibrate();
      const previousState = historyStack.pop();
      state = JSON.parse(previousState);
      
      if (historyStack.length === 0) {
        document.getElementById('undo-btn').disabled = true;
      }
      updateUI();
    }

    function resetGameWithConfirm() {
      if (confirm("試合スコアをリセットして初期状態に戻しますか？")) {
        resetGame();
      }
    }

    function resetGame() {
      saveStateToHistory();
      state.scoreA = 0;
      state.scoreB = 0;
      state.servingTeam = 'A';
      state.serverNumber = state.isDoubles ? 2 : 1;
      state.isInitialFirstServer = true;
      state.activeServerA = 1;
      state.activeServerB = 1;
      state.isSwapped = false;
      state.timeoutsA = 2;
      state.timeoutsB = 2;
      state.gameEnded = false;
      updateUI();
      openStartServerModal();
    }

    /* ================= DISPLAY MODE & COURT SWAP ================= */

    function toggleDisplayMode() {
      vibrate();
      state.isDisplayMode = !state.isDisplayMode;
      
      const lockOverlay = document.getElementById('lock-overlay');
      const refereeControlsLeft = document.getElementById('referee-controls-left');
      const refereeControlsRight = document.getElementById('referee-controls-right');
      const refereeOnlyElements = document.querySelectorAll('.referee-only');
      const modeBtn = document.getElementById('toggle-mode-btn');
      const modeText = document.getElementById('mode-text');
      const modeIcon = document.getElementById('mode-icon');

      if (state.isDisplayMode) {
        lockOverlay.classList.remove('hidden');
        refereeControlsLeft.classList.add('invisible');
        refereeControlsRight.classList.add('invisible');
        refereeOnlyElements.forEach(el => el.classList.add('hidden'));

        modeBtn.classList.remove('bg-emerald-500', 'hover:bg-emerald-600', 'text-slate-950');
        modeBtn.classList.add('bg-amber-500', 'hover:bg-amber-600', 'text-slate-950', 'ring-4', 'ring-amber-500/40');
        modeText.innerText = "審判モードへ";
        modeIcon.className = "fa-solid fa-lock mr-1.5";
      } else {
        lockOverlay.classList.add('hidden');
        refereeControlsLeft.classList.remove('invisible');
        refereeControlsRight.classList.remove('invisible');
        refereeOnlyElements.forEach(el => el.classList.remove('hidden'));

        modeBtn.classList.remove('bg-amber-500', 'hover:bg-amber-600', 'ring-4', 'ring-amber-500/40');
        modeBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-600', 'text-slate-950');
        modeText.innerText = "表示モードへ";
        modeIcon.className = "fa-solid fa-expand mr-1.5";
      }

      updateLayoutOrientation();
    }

    function swapSides() {
      saveStateToHistory();
      state.isSwapped = !state.isSwapped;
      vibrate();
      updateUI();
    }

    function updateLayoutOrientation() {
      const mainContainer = document.getElementById('main-container');
      
      // コートチェンジ(isSwapped) または 表示モード(isDisplayMode) の際に左右反転
      const shouldReverse = state.isSwapped ^ state.isDisplayMode;

      if (shouldReverse) {
        mainContainer.classList.add('flex-col-reverse', 'landscape:flex-row-reverse');
      } else {
        mainContainer.classList.remove('flex-col-reverse', 'landscape:flex-row-reverse');
      }
    }

    /* ================= UI UPDATE ENGINE ================= */

    function updateUI() {
      document.getElementById('team-a-score').innerText = state.scoreA;
      document.getElementById('team-b-score').innerText = state.scoreB;

      document.getElementById('timeout-a-count').innerText = state.timeoutsA;
      document.getElementById('timeout-b-count').innerText = state.timeoutsB;

      const isA = state.servingTeam === 'A';
      const myScore = isA ? state.scoreA : state.scoreB;
      const oppScore = isA ? state.scoreB : state.scoreA;

      let callStr = state.isDoubles ? `${myScore} - ${oppScore} - ${state.serverNumber}` : `${myScore} - ${oppScore}`;
      
      const callDisplayEl = document.getElementById('call-display');
      callDisplayEl.innerText = callStr;

      const teamAName = document.getElementById('team-a-name').value || 'チーム A';
      const teamBName = document.getElementById('team-b-name').value || 'チーム B';
      const servingTeamLabel = document.getElementById('serving-team-label');
      servingTeamLabel.innerText = `${isA ? teamAName : teamBName} サーブ`;

      // カラー固定 (チームA: 水色 text-cyan-400, チームB: オレンジ text-amber-400)
      if (isA) {
        callDisplayEl.className = "text-base sm:text-xl font-black tracking-wider my-0.5 transition-colors text-cyan-400 drop-shadow-[0_0_10px_rgba(34,211,238,0.3)]";
        servingTeamLabel.className = "text-[11px] font-semibold transition-colors text-cyan-400";
      } else {
        callDisplayEl.className = "text-base sm:text-xl font-black tracking-wider my-0.5 transition-colors text-amber-400 drop-shadow-[0_0_10px_rgba(251,191,36,0.3)]";
        servingTeamLabel.className = "text-[11px] font-semibold transition-colors text-amber-400";
      }

      const badgeA = document.getElementById('team-a-server-badge');
      const badgeB = document.getElementById('team-b-server-badge');
      const textA = document.getElementById('team-a-server-text');
      const textB = document.getElementById('team-b-server-text');

      const serverSuffix = state.serverNumber === 1 ? "1st" : "2nd";

      if (isA) {
        badgeA.className = "mt-2 px-3 py-1 rounded-full text-xs font-bold bg-cyan-500 text-slate-950 border border-cyan-300 serving-active shadow-[0_0_12px_rgba(34,211,238,0.5)]";
        textA.innerText = state.isDoubles ? `サーブ (${serverSuffix})` : "サーブ権あり";
        badgeB.className = "mt-2 px-3 py-1 rounded-full text-xs font-bold bg-slate-800/80 text-slate-500 border border-slate-700";
        textB.innerText = "レシーブ";
      } else {
        badgeB.className = "mt-2 px-3 py-1 rounded-full text-xs font-bold bg-amber-400 text-slate-950 border border-amber-200 serving-active shadow-[0_0_12px_rgba(251,191,36,0.5)]";
        textB.innerText = state.isDoubles ? `サーブ (${serverSuffix})` : "サーブ権あり";
        badgeA.className = "mt-2 px-3 py-1 rounded-full text-xs font-bold bg-slate-800/80 text-slate-500 border border-slate-700";
        textA.innerText = "レシーブ";
      }

      updatePlayerHighlights();
      updateCourtDiagram();
      updateLayoutOrientation();
      updateSettingsUI();
    }

    function updatePlayerHighlights() {
      const containerA = document.getElementById('team-a-players-container');
      const containerB = document.getElementById('team-b-players-container');

      if (!state.isDoubles) {
        containerA.classList.add('hidden');
        containerB.classList.add('hidden');
        return;
      }
      containerA.classList.remove('hidden');
      containerB.classList.remove('hidden');

      const isA = state.servingTeam === 'A';

      // チームA (水色)
      const pA1Box = document.getElementById('player-a1-box');
      const pA2Box = document.getElementById('player-a2-box');
      const pA1Badge = document.getElementById('player-a1-badge');
      const pA2Badge = document.getElementById('player-a2-badge');

      pA1Box.className = "flex-1 p-1.5 rounded-lg border bg-slate-950/50 flex items-center justify-between transition-all " +
        (isA && state.activeServerA === 1 ? "border-cyan-400 bg-cyan-950/40 ring-2 ring-cyan-400/30" : "border-slate-800");
      pA1Badge.className = isA && state.activeServerA === 1 ? "text-[10px] px-1.5 py-0.5 rounded bg-cyan-400 text-slate-950 font-bold shrink-0 ml-1" : "hidden";

      pA2Box.className = "flex-1 p-1.5 rounded-lg border bg-slate-950/50 flex items-center justify-between transition-all " +
        (isA && state.activeServerA === 2 ? "border-cyan-400 bg-cyan-950/40 ring-2 ring-cyan-400/30" : "border-slate-800");
      pA2Badge.className = isA && state.activeServerA === 2 ? "text-[10px] px-1.5 py-0.5 rounded bg-cyan-400 text-slate-950 font-bold shrink-0 ml-1" : "hidden";

      // チームB (オレンジ)
      const pB1Box = document.getElementById('player-b1-box');
      const pB2Box = document.getElementById('player-b2-box');
      const pB1Badge = document.getElementById('player-b1-badge');
      const pB2Badge = document.getElementById('player-b2-badge');

      pB1Box.className = "flex-1 p-1.5 rounded-lg border bg-slate-950/50 flex items-center justify-between transition-all " +
        (!isA && state.activeServerB === 1 ? "border-amber-400 bg-amber-950/40 ring-2 ring-amber-400/30" : "border-slate-800");
      pB1Badge.className = !isA && state.activeServerB === 1 ? "text-[10px] px-1.5 py-0.5 rounded bg-amber-400 text-slate-950 font-bold shrink-0 ml-1" : "hidden";

      pB2Box.className = "flex-1 p-1.5 rounded-lg border bg-slate-950/50 flex items-center justify-between transition-all " +
        (!isA && state.activeServerB === 2 ? "border-amber-400 bg-amber-950/40 ring-2 ring-amber-400/30" : "border-slate-800");
      pB2Badge.className = !isA && state.activeServerB === 2 ? "text-[10px] px-1.5 py-0.5 rounded bg-amber-400 text-slate-950 font-bold shrink-0 ml-1" : "hidden";
    }

    function updateCourtDiagram() {
      const cells = ['court-a-left', 'court-a-right', 'court-b-left', 'court-b-right'];
      cells.forEach(id => {
        const el = document.getElementById(id);
        el.className = el.className.replace(/bg-.* text-.*/, '') + " text-[9px] font-bold " + (id.startsWith('court-a') ? "text-cyan-500/60" : "text-amber-500/60");
        el.innerText = id.endsWith('left') ? 'L' : 'R';
      });

      const isA = state.servingTeam === 'A';
      const currentScore = isA ? state.scoreA : state.scoreB;
      const isRightCourt = (currentScore % 2 !== 0);

      let activeCellId = isA ? (isRightCourt ? 'court-a-right' : 'court-a-left') : (isRightCourt ? 'court-b-right' : 'court-b-left');
      const activeEl = document.getElementById(activeCellId);
      if (activeEl) {
        activeEl.className += isA ? " bg-cyan-500 text-slate-950 font-black" : " bg-amber-400 text-slate-950 font-black";
        activeEl.innerText = "SERVE";
      }
    }

    function updateSettingsUI() {
      const btnDoubles = document.getElementById('opt-doubles');
      const btnSingles = document.getElementById('opt-singles');
      if (state.isDoubles) {
        btnDoubles.className = "py-2 rounded-lg font-bold border border-emerald-500 bg-emerald-500/20 text-emerald-400";
        btnSingles.className = "py-2 rounded-lg font-bold border border-slate-700 bg-slate-800 text-slate-400";
      } else {
        btnSingles.className = "py-2 rounded-lg font-bold border border-emerald-500 bg-emerald-500/20 text-emerald-400";
        btnDoubles.className = "py-2 rounded-lg font-bold border border-slate-700 bg-slate-800 text-slate-400";
      }

      [11, 15, 21].forEach(score => {
        const btn = document.getElementById(`target-${score}`);
        if (state.targetScore === score) {
          btn.className = "target-score-btn py-1.5 rounded-lg border border-emerald-500 bg-emerald-500/20 text-emerald-400 font-bold";
        } else {
          btn.className = "target-score-btn py-1.5 rounded-lg border border-slate-700 bg-slate-800 text-slate-400 font-bold";
        }
      });
    }

    /* ================= MANUAL CONTROLS & UTILS ================= */

    function switchServerManual() {
      if (!state.isDoubles) return;
      saveStateToHistory();
      state.serverNumber = state.serverNumber === 1 ? 2 : 1;
      vibrate();
      updateUI();
    }

    function updateTeamNames() {
      updateUI();
    }

    /* ================= TIMEOUT COUNTER ================= */

    function triggerTimeout(team) {
      if (team === 'A' && state.timeoutsA <= 0) return;
      if (team === 'B' && state.timeoutsB <= 0) return;

      saveStateToHistory();
      if (team === 'A') state.timeoutsA--;
      else state.timeoutsB--;

      const teamName = document.getElementById(team === 'A' ? 'team-a-name' : 'team-b-name').value;
      document.getElementById('timeout-team-name').innerText = teamName;
      
      showModal('timeout-modal');
      startTimeoutTimer(60);
      updateUI();
    }

    function startTimeoutTimer(seconds) {
      clearInterval(timeoutTimerInterval);
      let timeLeft = seconds;
      const display = document.getElementById('timeout-timer');
      display.innerText = timeLeft;

      timeoutTimerInterval = setInterval(() => {
        timeLeft--;
        display.innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timeoutTimerInterval);
          vibrate([200, 100, 200]);
        }
      }, 1000);
    }

    function closeTimeoutModal() {
      clearInterval(timeoutTimerInterval);
      closeModal('timeout-modal');
    }

    /* ================= SETTINGS CONTROLS ================= */

    function openSettingsModal() {
      showModal('settings-modal');
    }

    function setGameType(type) {
      saveStateToHistory();
      state.isDoubles = (type === 'doubles');
      state.serverNumber = state.isDoubles ? 2 : 1;
      updateUI();
    }

    function setTargetScore(score) {
      saveStateToHistory();
      state.targetScore = score;
      updateUI();
    }

    function toggleWinByTwo() {
      saveStateToHistory();
      state.winByTwo = document.getElementById('win-by-two').checked;
    }

    /* ================= HELPER FUNCTIONS ================= */

    function vibrate(pattern = 30) {
      if ('vibrate' in navigator) {
        navigator.vibrate(pattern);
      }
    }

    function showModal(id) {
      document.getElementById(id).classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake Lock Error:', err);
      }
    }
  </script>
</body>
</html>
